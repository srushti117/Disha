name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt -c constraints.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Run tests
        # Real-service tests are opt-in (DISHA_LIVE_TESTS) and skipped here: CI must not depend on third-party uptime.
        run: python -m pytest tests -q -ra

  backend-postgis:
    name: Backend tests (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: disha
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: disha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disha -d disha"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - name: Run tests against PostGIS
        env:
          DISHA_TEST_DATABASE_URL: postgresql+psycopg://disha:ci_only_password@localhost:5432/disha
        run: python -m pytest tests -q -ra

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    name: Browser end-to-end (simulated demo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    # Not verified on GitHub's runners before the first push; reported but does not block merges until it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start API and UI
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db
          DATA_DIR: ${{ github.workspace }}/ci-data
          MODELS_DIR: ${{ github.workspace }}/ci-models
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
          DEMO_STEP_DELAY: "1.0"
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && nohup npx next start -p 3000 > ../ui.log 2>&1 &)
          for i in $(seq 1 40); do curl -fs localhost:8000/api/health >/dev/null && curl -fs localhost:3000/login >/dev/null && break; sleep 2; done
          curl -fs localhost:8000/api/health
      - name: Run browser tests (system Chrome)
        working-directory: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-audit --no-fund
          node run.mjs
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots
            api.log
            ui.log
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image build could not be verified in the authoring environment; this job is how it gets verified.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
